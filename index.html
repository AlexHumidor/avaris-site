<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaris — скачать</title>
<style>
  :root { --bg: #fff; --fg: #111; --dim: #777; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #eee; --dim: #888; }
  }
  * { box-sizing: border-box; }
  body {
    max-width: 780px;
    margin: 0 auto;
    padding: 56px 20px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 32px; }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 48px;
    align-items: start;
  }

  .buttons { display: grid; gap: 10px; }
  .btn {
    padding: 12px 16px;
    border: 1px solid var(--fg);
    color: var(--fg);
    text-decoration: none;
  }
  .btn:hover { background: var(--fg); color: var(--bg); }

  h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .date { color: var(--dim); font-size: 14px; margin: 2px 0 12px; }
  p { margin: 0; }

  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; gap: 32px; }
  }
</style>
</head>
<body>

<h1>Avaris</h1>

<div class="layout">

  <div class="buttons">
    <a class="btn" href="downloads/Avaris-win64.zip">Windows 64-bit</a>
    <a class="btn" href="downloads/Avaris-linux_x86_64.tar.xz">Linux x86-64</a>
  </div>

  <div>
    <h2>1.0</h2>
    <p class="date">Первая версия</p>
  </div>

</div>

</body>
</html>
